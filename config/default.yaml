# Default configuration. Mode is deliberately `backtest` — spec §2.3 requires
# every config file to default to a non-trading mode. Live also needs
# LIVE_TRADING=true in the environment before it will arm.
#
# PHASE 2 PIVOT (DECISIONS §39/§40): `tokens[]` below is the phase-1
# indicator-driven (RSI/MFI mean-reversion) config — REJECTED as a live-entry
# hypothesis (DECISIONS's top section), kept only because data:fetch/
# data:screen/backtest still read it. It is NOT the live entry path anymore.
# `positions[]` — empty by default, add your own — is: manual token pick,
# limit price, take-profit ladder. Run `npm run config:check` after editing
# it; it prints every tranche's cost-preview numbers and rejects a ladder
# whose economics don't clear (DECISIONS §40).

global:
  mode: paper
  # Pins the SOL/USD(C) reference pool data:fetch uses for the regime and
  # relative-strength filters (DECISIONS §20, §29/§30) — Orca's deep SOL/USDC
  # pool, ~$25M reserve at time of writing. Skips discovery/dominance
  # comparison for this series in exchange for a stable pool between runs and
  # far fewer requests; --sol-pool-address overrides this for a one-off run.
  solReferencePoolAddress: "Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE"
  maxConcurrentPositions: 3
  dailyLossLimitPct: 10
  maxDeployedCapitalPct: 50
  maxAllocationPerTokenPct: 20
  indicatorWarmupMultiplier: 4.5    # period * 4.5 = 63 candles at period 14 — a 1% Wilder-decay
                                     # contamination budget, not 0.1%'s 98; DECISIONS §28
  minTradesForConclusion: 50
  stopPollSeconds: 30            # live stops are evaluated intrabar, not on candle close
  exitSlippagePct: 0.5           # modelled adverse slippage on a stop fill

  regimeFilter:
    enabled: true
    solMaPeriod: 50
    solMaTimeframe: 4h

  costFloor:
    dexFeePct: 0.25
    priorityFeeSol: "0.0005"
    jitoTipSol: "0.0001"
    minTargetToCostRatio: 3         # target move must beat round-trip cost 3x
    fallbackSlippagePct: 1          # used when historical pool liquidity is absent

tiers:
  A:
    minLiquidityUsd: 250000
    minVolume24hUsd: 500000
    minAgeDays: 30
  B:
    minLiquidityUsd: 100000
    minVolume24hUsd: 250000
    minAgeDays: 7
    maxLpDeclinePct: 10
    lpTrendWindowMinutes: 20
    requireMintAuthorityRevoked: true
    requireFreezeAuthorityRevoked: true
    requireLpBurnedOrLocked: true
    maxTop10HolderPct: 30
    minPriorCycles: 1
    recheckIntervalMinutes: 5

tokens:
  - address: "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"
    symbol: JUP
    tier: A
    timeframe: 1h
    buyAmountSol: "0.5"
    # Pins the meteora JUP/SOL pool validated across this project's real-data
    # reviews (DECISIONS §24-§27, ~$1.38M reserve at time of writing) rather
    # than re-discovering and comparing candidates every fetch — the root fix
    # for pool-selection instability under rate limiting (DECISIONS §29/§30).
    # --pool-address overrides this for a one-off run.
    pinnedPoolAddress: "C8Gr6AUuq9hEdSYJzoEpNcdjpojPZwqG5MtQbeouNNwg"
    rsi:
      period: 14
      oversold: 30
      overbought: 70
    mfi:
      period: 14
      threshold: 30
    entry:
      priorOverboughtWithinCandles: 50
      requireDivergence: false
      minUnderperformanceVsSol: 0.05
      relativeStrengthLookback: 24
    exit:
      stopLossPct: 15
      timeExitCandles: 48
      rsiExitLevel: 70
      trailingStop:
        enabled: false
        activateAtPct: 20
        trailPct: 10
    limits:
      maxPctOfPoolLiquidity: 0.5
      cooldownCandlesAfterLoss: 24
      minViableBuyAmountSol: "0.05"

# The live entry path (DECISIONS §39/§40, paper run per DECISIONS §41 soak
# test). Example shape below kept for reference:
#
# positions:
#   - address: "<mint>"
#     symbol: SYM
#     buyAmountSol: "0.5"
#     limitPrice: 0.80          # buys when observed price is at or below this
#     ladder:
#       tranches:
#         - targetGainPct: 20     # sell 33% at +20%
#           sellPct: 33
#         - targetGainPct: 50     # sell another 33% at +50%
#           sellPct: 33
#         - targetGainPct: 100    # sell the last 34% at +100%
#           sellPct: 34
#       trailing:
#         enabled: true
#         trailPct: 15            # arms once the first tranche fills
#       stopLossPct: 15
#       timeExitMinutes: 4320     # 3 days
#       minNetFloorPct: 5         # DECISIONS §40 — reject a tranche netting less than this
#       maxFixedCostPctOfProceeds: 20   # DECISIONS §40 — reject a tranche too small for its own fixed fee
#
# ACTIVE: the paper-trading soak test (DECISIONS §41, one-week minimum).
# JUP on the same pinned meteora JUP/SOL pool tokens[] above already uses —
# most validated pool in this project (§24-§31). limitPrice is set ~3%
# above spot (0.0020454 SOL/JUP observed 2026-08-30) deliberately, so entry
# fires promptly — this soak tests the EXECUTION machinery, not entry
# quality (CLAUDE.md: report numbers, never claim profitability). 0.1 SOL
# buy size: small (mechanism test only), and clears both the 5% net floor
# and 20% fixed-cost ratio checks on every tranche with comfortable margin
# — see the config:check output recorded in DECISIONS §41 before this run
# started.
positions:
  - address: "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN"
    symbol: JUP
    buyAmountSol: "0.1"
    limitPrice: 0.0021068
    pinnedPoolAddress: "C8Gr6AUuq9hEdSYJzoEpNcdjpojPZwqG5MtQbeouNNwg"
    ladder:
      tranches:
        - targetGainPct: 10     # sell 40% at +10%
          sellPct: 40
        - targetGainPct: 20     # sell 30% at +20%
          sellPct: 30
                                 # remaining 30% held, exits only via trailing/stop/time
      trailing:
        enabled: true
        trailPct: 10            # arms once tranche 1 (the +10% target) fills
      stopLossPct: 15
      timeExitMinutes: 4320     # 72 hours — soak minimum is 1 week, so this is expected to fire
                                 # well before the week is up on any position still open that long
      minNetFloorPct: 5
      maxFixedCostPctOfProceeds: 20
